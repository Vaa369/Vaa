<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الدفع - ساحل</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header>
  <div class="container nav">
    <div><a href="/">ساحل</a></div>
    <nav>
      <a href="/cart.html">السلة</a>
    </nav>
  </div>
</header>
<main class="container">
  <h1>الدفع</h1>
  <form id="checkout-form">
    <input name="fullName" placeholder="الاسم الكامل" required>
    <input name="phone" placeholder="رقم الموبايل" required>
    <input name="address" placeholder="العنوان داخل الساحل" required>
    <select name="paymentMethod">
      <option value="cod">الدفع عند الاستلام</option>
      <option value="card">بطاقة ائتمانية</option>
      <option value="wallet">محفظة إلكترونية</option>
    </select>
    <button class="btn" type="submit">تأكيد الطلب</button>
  </form>
  <div id="result" style="margin-top:12px"></div>
</main>
<footer>
  <div class="container">© 2025 ساحل</div>
</footer>
<script>
function getCart(){try{return JSON.parse(localStorage.getItem('sahel_cart')||'[]')}catch{return []}}
async function createOrder(payload){
  const res = await fetch('/api/orders', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  if(!res.ok) throw new Error('فشل إنشاء الطلب');
  return res.json();
}

document.getElementById('checkout-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const form = new FormData(e.target);
  const items = getCart();
  if(items.length===0) return alert('السلة فارغة');
  const payload = {
    userId: null,
    items,
    address: form.get('address'),
    paymentMethod: form.get('paymentMethod')
  };
  try{
    const order = await createOrder(payload);
    document.getElementById('result').innerHTML = `تم إنشاء الطلب بنجاح. رقم الطلب: <strong>${order.id}</strong> - <a href='/order-tracking.html?orderId=${order.id}'>تتبع الآن</a>`;
    localStorage.removeItem('sahel_cart');
  }catch(err){ alert(err.message); }
});
</script>
</body>
</html>
